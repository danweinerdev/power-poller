; Example configuration for a smart power strip with individual child outlets
; This demonstrates the child device feature for TP-Link KASA smart power strips

[global]
database = influxdb
devices = office_powerstrip

; InfluxDB configuration
[influxdb]
server = 127.0.0.1
port = 8086
ssl = false
verify = false
database = smart-home

; Parent device configuration (smart power strip)
; The parent represents the entire power strip hardware
[office_powerstrip]
address = 10.0.0.100
; Mark this device as having children
has_children = true
; Optional: Set to true to also collect aggregate metrics from the parent device
; If false, only child devices will be polled
poll_parent = true
; Measurements for parent device (only used if poll_parent = true)
measurements = power-metrics
; Tags applied to parent device metrics
tags = location=office type=strip

; Child device configurations
; Format: [parent_name.child_N] where N is the zero-based index
; Each outlet on the power strip is a child device

[office_powerstrip.child_0]
; Friendly name for this outlet (used in metrics 'device' tag)
device = desk_lamp
; Measurement type for this child
measurements = power-metrics
; Tags specific to this child (merged with parent location tag)
tags = outlet=0 appliance=lamp category=lighting

[office_powerstrip.child_1]
device = monitor
measurements = power-metrics
tags = outlet=1 appliance=monitor category=computer

[office_powerstrip.child_2]
device = laptop_charger
measurements = power-metrics
tags = outlet=2 appliance=charger category=computer

[office_powerstrip.child_3]
device = desk_fan
measurements = power-metrics
tags = outlet=3 appliance=fan category=comfort

[office_powerstrip.child_4]
device = phone_charger
measurements = power-metrics
tags = outlet=4 appliance=charger category=mobile

[office_powerstrip.child_5]
device = spare_outlet
measurements = power-metrics
tags = outlet=5 appliance=spare category=misc

; Measurement field definitions
; These define which emeter fields to collect for each measurement
[power-metrics]
fields = current:float voltage:float power:float total:float
