[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kasa-monitor"
version = "2.0.0"
description = "A unified Python library and CLI tool for monitoring and controlling TP-Link KASA smart home devices with InfluxDB integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Daniel Weiner"}
]
keywords = ["kasa", "tplink", "smart home", "monitoring", "influxdb", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "python-kasa>=0.10.2",
    "influxdb-client>=1.36.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.1",
    "pytest-timeout>=2.1.0",
    "coverage>=7.3.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.scripts]
kasa-monitor = "kasa_monitor.__main__:main"

[project.urls]
Homepage = "https://github.com/yourusername/tplink-smart-devices"
Issues = "https://github.com/yourusername/tplink-smart-devices/issues"

[tool.setuptools]
packages = ["kasa_monitor", "kasa_monitor.core", "kasa_monitor.devices", "kasa_monitor.commands"]

[tool.setuptools.package-data]
kasa_monitor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests that take significant time to run",
]

[tool.coverage.run]
source = ["kasa_monitor"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
